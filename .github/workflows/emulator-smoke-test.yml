name: Emulator smoke test

# Runs the built app on a real Android emulator in GitHub Actions and
# takes screenshots, because there is no phone or emulator available on
# the builder VM. Manual trigger only (Actions tab > Run workflow).
# Free for this public repo. Uses the same unzip + JDK + SDK steps as
# Android CI, then boots an API 36 emulator with KVM, installs the
# debug APK, seeds the app's built-in sample month (menu > Add sample
# data) so the screenshots show real entries and charts, and captures
# five store-quality screenshots: home, charts, budgets, help and the
# add-entry sheet. Screenshots land as the "emulator-screenshots"
# artifact.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Unzip project source
        run: unzip -q -o expense-tracker.zip -d .

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Install Android 16 (API 36) platform and build-tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Drop local SDK path (points at the builder VM, invalid here)
        run: rm -f local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Write the tap helper
        run: |
          cat > tap_text.py <<'PYEOF'
          """Tap a UI element on the emulator by its text or content description.

          Usage: python3 tap_text.py "Add sample data"
          Matches case-insensitively against node text + content-desc.
          Exits 0 even when nothing is found (caller keeps going).
          """
          import re, subprocess, sys, xml.etree.ElementTree as ET

          want = sys.argv[1].lower()
          subprocess.run(["adb", "shell", "uiautomator", "dump", "/sdcard/window_dump.xml"], check=False)
          subprocess.run(["adb", "pull", "/sdcard/window_dump.xml", "window_dump.xml"], check=False)
          try:
              tree = ET.parse("window_dump.xml")
          except Exception as e:
              print("tap helper: could not read window dump:", e)
              sys.exit(0)
          for node in tree.iter("node"):
              desc = (node.get("content-desc") or "") + " " + (node.get("text") or "")
              if want in desc.lower():
                  m = re.match(r"\[(\d+),(\d+)\]\[(\d+),(\d+)\]", node.get("bounds") or "")
                  if m:
                      x1, y1, x2, y2 = map(int, m.groups())
                      cx, cy = (x1 + x2) // 2, (y1 + y2) // 2
                      print("tap helper: tapping", desc.strip(), "at", cx, cy)
                      subprocess.run(["adb", "shell", "input", "tap", str(cx), str(cy)])
                      sys.exit(0)
          print("tap helper: '" + sys.argv[1] + "' not found, skipping tap")
          PYEOF

      - name: Write the home-screen wait helper
        # The wait is a separate script file (like tap_text.py): a
        # multi-line for-loop inside the emulator step's script broke run
        # #3 — the runner only passed the loop's first line to the shell.
        run: |
          cat > wait_home.sh <<'SHEOF'
          #!/bin/sh
          # Wait until the home screen is actually up before screenshotting:
          # on a cold emulator the app can sit on its splash icon for
          # several seconds, and a fixed sleep photographs the splash.
          i=1
          while [ $i -le 30 ]; do
            adb shell uiautomator dump /sdcard/window_dump.xml >/dev/null 2>&1
            if adb shell grep -q "ClearLedger" /sdcard/window_dump.xml 2>/dev/null; then
              echo "home screen visible after ${i}s"
              exit 0
            fi
            sleep 1
            i=$((i + 1))
          done
          echo "home screen not seen after 30s, screenshotting anyway"
          SHEOF
          chmod +x wait_home.sh

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb install app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n com.clearledger.expenses/.MainActivity
            ./wait_home.sh
            python3 tap_text.py "More options"
            sleep 1
            python3 tap_text.py "Add sample data"
            sleep 3
            adb exec-out screencap -p > emulator-home.png
            adb shell input swipe 540 1800 540 600 600
            sleep 1
            adb shell input swipe 540 1800 540 600 600
            sleep 1
            adb exec-out screencap -p > emulator-charts.png
            adb shell input swipe 540 600 540 1800 600
            sleep 1
            adb shell input swipe 540 600 540 1800 600
            sleep 1
            python3 tap_text.py "More options"
            sleep 1
            python3 tap_text.py "Budgets"
            sleep 2
            adb exec-out screencap -p > emulator-budgets.png
            adb shell input keyevent 4
            sleep 1
            python3 tap_text.py "Help"
            sleep 2
            adb exec-out screencap -p > emulator-help.png
            adb shell input keyevent 4
            sleep 1
            python3 tap_text.py "Add entry"
            sleep 3
            adb exec-out screencap -p > emulator-add.png
            adb logcat -d | tail -100 > emulator-logcat.txt || true
            ls -l emulator-home.png emulator-charts.png emulator-budgets.png emulator-help.png emulator-add.png

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-screenshots
          path: |
            emulator-home.png
            emulator-charts.png
            emulator-budgets.png
            emulator-help.png
            emulator-add.png
            emulator-logcat.txt
          if-no-files-found: warn
